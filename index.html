<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Infinix — National Day Gyroscope Reveal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --infinix-green: #00FF66;
      --infinix-cyan: #00E5FF;
      --bg-void: #05080A;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-void);
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    .font-rajdhani {
      font-family: 'Rajdhani', sans-serif;
    }

    .tech-grid {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 102, 0.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 229, 255, 0.045) 1px, transparent 1px);
    }

    .ambient-glow {
      background: radial-gradient(circle at 50% 45%, rgba(0, 255, 102, 0.14) 0%, rgba(0, 229, 255, 0.05) 38%, rgba(5, 8, 10, 0.96) 78%);
    }

    .holo-card {
      background: linear-gradient(145deg, rgba(13, 21, 27, 0.88) 0%, rgba(7, 12, 16, 0.94) 100%);
      border: 1px solid rgba(0, 255, 102, 0.32);
      box-shadow:
        0 25px 60px -15px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(0, 255, 102, 0.14),
        inset 0 0 24px rgba(0, 229, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transform-style: preserve-3d;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .holo-card.revealed-glow {
      border-color: rgba(0, 255, 102, 0.75);
      box-shadow:
        0 25px 70px -10px rgba(0, 0, 0, 0.92),
        0 0 55px rgba(0, 255, 102, 0.32),
        0 0 90px rgba(0, 229, 255, 0.18),
        inset 0 0 32px rgba(0, 255, 102, 0.16);
    }

    .holo-shimmer {
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(0, 255, 102, 0.08) 38%,
        rgba(0, 229, 255, 0.18) 50%,
        rgba(255, 255, 255, 0.12) 54%,
        transparent 72%
      );
      background-size: 250% 250%;
      animation: shimmerSweep 6s ease-in-out infinite;
    }

    @keyframes shimmerSweep {
      0% { background-position: 140% 0%; }
      50% { background-position: -40% 100%; }
      100% { background-position: 140% 0%; }
    }

    .neon-title {
      text-shadow:
        0 0 12px rgba(0, 255, 102, 0.55),
        0 0 32px rgba(0, 255, 102, 0.25);
    }

    .cyan-glow {
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
    }

    .hud-bracket {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #00FF66;
      pointer-events: none;
    }

    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 255, 102, 0.025) 50%,
        rgba(0, 255, 102, 0.025)
      );
      background-size: 100% 4px;
    }

    #particleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      touch-action: none;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      border: 1px solid #00FF66;
      animation: pulseRing 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden bg-[#05080A]">

  <div class="fixed inset-0 tech-grid ambient-glow pointer-events-none z-0"></div>
  <div class="fixed inset-0 scanlines pointer-events-none z-10"></div>

  <!-- Top HUD -->

            THE FUTURE IS NOW
          </div>
          <div class="font-rajdhani text-[11px] text-slate-400 tracking-[0.14em] uppercase mt-0.5">
            POWERED BY INFINIX LABS

        <div class="flex items-end gap-[3px] h-6 opacity-75">
          <span class="w-[2px] h-full bg-[#00FF66]"></span>

          <span class="w-[4px] h-4 bg-[#00E5FF]"></span>

  </main>

  <!-- Interactive Particle Field Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Floating Bottom Controls -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 flex flex-col items-center justify-end pb-5 sm:pb-7 px-4 pointer-events-none gap-3">
    <div id="hintBanner" class="pointer-events-auto flex items-center gap-2 bg-[#070D11]/85 border border-[#00E5FF]/30 backdrop-blur-md px-4 py-2 rounded-full shadow-lg transition-all duration-300">
      <svg class="w-4 h-4 text-[#00FF66] shrink-0 animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="6" y="2" width="12" height="20" rx="2" ry="2"></rect>
        <path d="M12 18h.01"></path>
      </svg>
      <span id="hintText" class="font-rajdhani text-xs sm:text-sm font-semibold tracking-wider text-slate-200 uppercase">
        Tilt phone or drag to sweep particles into a corner
      </span>
    </div>

    <div class="pointer-events-auto flex flex-wrap items-center justify-center gap-2.5 sm:gap-3">
      <button id="enableGyroBtn" class="hidden pulse-ring relative items-center gap-2 px-4 py-2.5 rounded-full bg-[#00FF66] text-[#05080A] font-orbitron text-xs font-extrabold tracking-wider uppercase shadow-[0_0_24px_rgba(0,255,102,0.5)] active:scale-95 transition-transform cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 3v3m0 12v3M3 12h3m12 0h3"></path>
        </svg>
        <span>Enable Gyroscope</span>
      </button>

      <button id="simulateTiltBtn" class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-[#0B141A]/90 hover:bg-[#112029] border border-[#00E5FF]/45 text-[#00E5FF] font-orbitron text-xs font-bold tracking-wider uppercase shadow-[0_0_18px_rgba(0,229,255,0.2)] active:scale-95 transition-all cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M7 7l10 10M17 7v10H7"></path>
        </svg>
        <span id="simulateTiltLabel">Tilt to Corner</span>
      </button>

      <button id="resetBtn" class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-[#0B141A]/90 hover:bg-[#112029] border border-[#00FF66]/45 text-[#00FF66] font-orbitron text-xs font-bold tracking-wider uppercase shadow-[0_0_18px_rgba(0,255,102,0.18)] active:scale-95 transition-all cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>Reset</span>
      </button>

  <script>
    (function () {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      const revealCard = document.getElementById('revealCard');
      const revealBar = document.getElementById('revealBar');
      const revealPercentEl = document.getElementById('revealPercent');
      const tiltStatusText = document.getElementById('tiltStatusText');
      const hintText = document.getElementById('hintText');
      const enableGyroBtn = document.getElementById('enableGyroBtn');
      const simulateTiltBtn = document.getElementById('simulateTiltBtn');
      const simulateTiltLabel = document.getElementById('simulateTiltLabel');
      const resetBtn = document.getElementById('resetBtn');

      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');

      let particles = [];
      let burstParticles = [];
      let celebrationTriggered = false;
      let revealRatio = 0;

      const PALETTE = [
        { r: 0, g: 255, b: 102 },   // #00FF66
        { r: 0, g: 229, b: 255 },   // #00E5FF
        { r: 130, g: 255, b: 185 }, // Bright Mint
        { r: 0, g: 210, b: 120 }    // Deep Emerald Neon
      ];

      const gyro = {
        active: false,
        baseBeta: null,
        baseGamma: null,
        gx: 0,
        gy: 0,
        targetGx: 0,
        targetGy: 0
      };

      const pointer = {
        active: false,
        x: 0,
        y: 0
      };

      let demoCornerIndex = -1;
      const DEMO_CORNERS = [
        { gx: 0.85, gy: 0.85, label: 'BOTTOM-RIGHT' },
        { gx: -0.85, gy: 0.85, label: 'BOTTOM-LEFT' },
        { gx: -0.85, gy: -0.85, label: 'TOP-LEFT' },
        { gx: 0.85, gy: -0.85, label: 'TOP-RIGHT' }
      ];

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        maskCanvas.width = Math.floor(width * dpr);
        maskCanvas.height = Math.floor(height * dpr);
        maskCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function createParticle(index, total) {
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const t = (index + 0.5) / total;
        const maxRadius = Math.hypot(width * 0.52, height * 0.52);
        const r = Math.pow(t, 0.62) * maxRadius;
        const theta = index * goldenAngle;

        const homeX = width * 0.5 + Math.cos(theta) * r * (width / Math.max(width, height) * 1.15);
        const homeY = height * 0.5 + Math.sin(theta) * r * (height / Math.max(width, height) * 1.15);

        const color = PALETTE[index % PALETTE.length];
        const radius = 3.2 + Math.random() * 3.4;

        return {
          x: homeX,
          y: homeY,
          homeX,
          homeY,
          vx: 0,
          vy: 0,
          radius,
          mass: 0.75 + Math.random() * 0.55,
          alpha: 0.78 + Math.random() * 0.22,
          phase: Math.random() * Math.PI * 2,
          swirlSpeed: 0.015 + Math.random() * 0.025,
          color
        };
      }

      function initParticles() {
        particles = [];
        burstParticles = [];
        celebrationTriggered = false;
        revealRatio = 0;
        revealCard.classList.remove('revealed-glow');
        updateProgressUI(0);

        const area = width * height;
        const count = Math.max(260, Math.min(540, Math.floor(area / 1650)));
        for (let i = 0; i < count; i++) {
          particles.push(createParticle(i, count));
        }
      }

      function resolveParticleCollisions() {
        const cellSize = 18;
        const cols = Math.ceil(width / cellSize) + 1;
        const grid = new Map();

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const key = Math.floor(p.x / cellSize) + Math.floor(p.y / cellSize) * cols;
          let bucket = grid.get(key);
          if (!bucket) {
            bucket = [];
            grid.set(key, bucket);
          }
          bucket.push(i);
        }

        for (let i = 0; i < particles.length; i++) {
          const p1 = particles[i];
          const cx = Math.floor(p1.x / cellSize);
          const cy = Math.floor(p1.y / cellSize);

          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const bucket = grid.get((cx + dx) + (cy + dy) * cols);
              if (!bucket) continue;

              for (let k = 0; k < bucket.length; k++) {
                const j = bucket[k];
                if (j <= i) continue;
                const p2 = particles[j];

                const rx = p2.x - p1.x;
                const ry = p2.y - p1.y;
                const distSq = rx * rx + ry * ry;
                const minDist = (p1.radius + p2.radius) * 0.78;

                if (distSq > 0.0001 && distSq < minDist * minDist) {
                  const dist = Math.sqrt(distSq);
                  const overlap = (minDist - dist) * 0.28;
                  const nx = rx / dist;
                  const ny = ry / dist;

                  p1.x -= nx * overlap;
                  p1.y -= ny * overlap;
                  p2.x += nx * overlap;
                  p2.y += ny * overlap;
                }
              }
            }
          }
        }
      }

      function updateProgressUI(pct) {
        const clamped = Math.min(100, Math.max(0, Math.round(pct)));
        revealBar.style.width = `${clamped}%`;
        revealPercentEl.textContent = `${clamped}%`;
      }

      function triggerCelebrationBurst() {
        celebrationTriggered = true;
        revealCard.classList.add('revealed-glow');
        hintText.textContent = 'Happy National Day! Tilt flat or reset stardust';

        const cx = width * 0.5;
        const cy = height * 0.5;
        for (let i = 0; i < 65; i++) {
          const angle = (Math.PI * 2 * i) / 65 + Math.random() * 0.2;
          const speed = 2.5 + Math.random() * 5.5;
          burstParticles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 2 + Math.random() * 3,
            alpha: 1,
            color: PALETTE[i % PALETTE.length]
          });
        }
      }

      function updateTiltHUD(gx, gy) {
        const mag = Math.hypot(gx, gy);
        if (mag < 0.14) {
          tiltStatusText.textContent = 'TILT: NEUTRAL';
          return;
        }
        const vDir = gy > 0.18 ? 'BOTTOM' : gy < -0.18 ? 'TOP' : '';
        const hDir = gx > 0.18 ? 'RIGHT' : gx < -0.18 ? 'LEFT' : '';
        const dirLabel = [vDir, hDir].filter(Boolean).join('-') || 'ACTIVE';
        tiltStatusText.textContent = `TILT: ${dirLabel}`;
      }

      function animate() {
        requestAnimationFrame(animate);

        ctx.clearRect(0, 0, width, height);

        if (pointer.active) {
          gyro.targetGx = Math.max(-1.2, Math.min(1.2, (pointer.x - width * 0.5) / (width * 0.42)));
          gyro.targetGy = Math.max(-1.2, Math.min(1.2, (pointer.y - height * 0.5) / (height * 0.42)));
        } else if (demoCornerIndex >= 0) {
          gyro.targetGx = DEMO_CORNERS[demoCornerIndex].gx;
          gyro.targetGy = DEMO_CORNERS[demoCornerIndex].gy;
        } else if (!gyro.active) {
          gyro.targetGx = 0;
          gyro.targetGy = 0;
        }

        gyro.gx += (gyro.targetGx - gyro.gx) * 0.12;
        gyro.gy += (gyro.targetGy - gyro.gy) * 0.12;

        updateTiltHUD(gyro.gx, gyro.gy);

        const rotY = gyro.gx * 10;
        const rotX = -gyro.gy * 10;
        revealCard.style.transform = `rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;

        const tiltMag = Math.hypot(gyro.gx, gyro.gy);
        const isTilted = tiltMag > 0.14;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.phase += p.swirlSpeed;

          if (isTilted) {
            const accel = 0.74 / p.mass;
            p.vx += gyro.gx * accel + Math.cos(p.phase) * 0.06;
            p.vy += gyro.gy * accel + Math.sin(p.phase) * 0.06;
            p.vx *= 0.91;
            p.vy *= 0.91;
          } else {
            const dx = p.homeX - p.x;
            const dy = p.homeY - p.y;
            p.vx += dx * 0.018 + Math.cos(p.phase) * 0.04;
            p.vy += dy * 0.018 + Math.sin(p.phase) * 0.04;
            p.vx *= 0.86;
            p.vy *= 0.86;
          }

          p.x += p.vx;
          p.y += p.vy;

          const pad = p.radius + 4;
          if (p.x < pad) {
            p.x = pad;
            p.vx *= -0.35;
          } else if (p.x > width - pad) {
            p.x = width - pad;
            p.vx *= -0.35;
          }

          if (p.y < pad) {
            p.y = pad;
            p.vy *= -0.35;
          } else if (p.y > height - pad) {
            p.y = height - pad;
            p.vy *= -0.35;
          }
        }

        resolveParticleCollisions();
        resolveParticleCollisions();

        const cardRect = revealCard.getBoundingClientRect();
        const padMask = 14;
        const rx = cardRect.left - padMask;
        const ry = cardRect.top - padMask;
        const rw = cardRect.width + padMask * 2;
        const rh = cardRect.height + padMask * 2;

        maskCtx.globalCompositeOperation = 'source-over';
        maskCtx.clearRect(0, 0, width, height);
        maskCtx.fillStyle = 'rgba(5, 11, 14, 0.88)';
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (
            p.x > rx - 30 && p.x < rx + rw + 30 &&
            p.y > ry - 30 && p.y < ry + rh + 30
          ) {
            maskCtx.beginPath();
            maskCtx.arc(p.x, p.y, p.radius * 5.2, 0, Math.PI * 2);
            maskCtx.fill();
          }
        }

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cardRect.left, cardRect.top, cardRect.width, cardRect.height, 24);
        ctx.clip();
        ctx.drawImage(maskCanvas, 0, 0, width, height);
        ctx.restore();

        ctx.globalCompositeOperation = 'lighter';

        const gridCols = 10;
        const gridRows = 12;
        const totalCardCells = gridCols * gridRows;
        const occupiedCells = new Set();

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const { r, g, b } = p.color;

          if (
            p.x >= cardRect.left && p.x <= cardRect.right &&
            p.y >= cardRect.top && p.y <= cardRect.bottom
          ) {
            const gxIdx = Math.min(gridCols - 1, Math.floor(((p.x - cardRect.left) / cardRect.width) * gridCols));
            const gyIdx = Math.min(gridRows - 1, Math.floor(((p.y - cardRect.top) / cardRect.height) * gridRows));
            occupiedCells.add(gyIdx * gridCols + gxIdx);
          }

          const glowRadius = p.radius * 2.6;
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
          grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${p.alpha * 0.85})`);
          grad.addColorStop(0.45, `rgba(${r}, ${g}, ${b}, ${p.alpha * 0.32})`);
          grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `rgba(245, 255, 252, ${p.alpha * 0.95})`;
          ctx.beginPath();
          ctx.arc(p.x - p.radius * 0.15, p.y - p.radius * 0.15, p.radius * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const bp = burstParticles[i];
          bp.x += bp.vx;
          bp.y += bp.vy;
          bp.vx *= 0.95;
          bp.vy *= 0.95;
          bp.alpha -= 0.018;

          if (bp.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
          }

          const { r, g, b } = bp.color;
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${bp.alpha})`;
          ctx.beginPath();
          ctx.arc(bp.x, bp.y, bp.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalCompositeOperation = 'source-over';

        const clearedCardCells = totalCardCells - occupiedCells.size;
        const rawRatio = totalCardCells > 0 ? clearedCardCells / totalCardCells : 0;
        const normalizedPct = Math.min(100, Math.max(0, ((rawRatio - 0.12) / 0.80) * 100));
        revealRatio += (normalizedPct - revealRatio) * 0.16;
        updateProgressUI(revealRatio);

        if (revealRatio >= 72 && !celebrationTriggered) {
          triggerCelebrationBurst();
        }
      }

      function handleDeviceOrientation(event) {
        if (event.beta === null || event.gamma === null) return;
        gyro.active = true;

        if (gyro.baseBeta === null || gyro.baseGamma === null) {
          gyro.baseBeta = event.beta;
          gyro.baseGamma = event.gamma;
        }

        const deltaGamma = event.gamma - gyro.baseGamma;
        const deltaBeta = event.beta - gyro.baseBeta;

        gyro.targetGx = Math.max(-1.25, Math.min(1.25, deltaGamma / 26));
        gyro.targetGy = Math.max(-1.25, Math.min(1.25, deltaBeta / 26));
      }

      function setupSensors() {
        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          enableGyroBtn.classList.remove('hidden');
          enableGyroBtn.classList.add('flex');

          enableGyroBtn.addEventListener('click', () => {
            DeviceOrientationEvent.requestPermission()
              .then((state) => {
                if (state === 'granted') {
                  window.addEventListener('deviceorientation', handleDeviceOrientation);
                  enableGyroBtn.classList.add('hidden');
                  enableGyroBtn.classList.remove('flex');
                  hintText.textContent = 'Gyroscope active — tilt phone toward any corner!';
                }
              })
              .catch(() => {
                hintText.textContent = 'Touch & drag screen to sweep particles';
              });
          });
        } else if (typeof window !== 'undefined' && 'DeviceOrientationEvent' in window) {
          window.addEventListener('deviceorientation', handleDeviceOrientation);
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        pointer.active = true;
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        demoCornerIndex = -1;
        simulateTiltLabel.textContent = 'Tilt to Corner';
      });

      window.addEventListener('pointermove', (e) => {
        if (!pointer.active) return;
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      });

      window.addEventListener('pointerup', () => {
        pointer.active = false;
      });

      window.addEventListener('pointercancel', () => {
        pointer.active = false;
      });

      simulateTiltBtn.addEventListener('click', () => {
        demoCornerIndex = (demoCornerIndex + 1) % (DEMO_CORNERS.length + 1);
        if (demoCornerIndex === DEMO_CORNERS.length) {
          demoCornerIndex = -1;
          simulateTiltLabel.textContent = 'Tilt to Corner';
          hintText.textContent = 'Tilt phone or drag to sweep particles into a corner';
        } else {
          const corner = DEMO_CORNERS[demoCornerIndex];
          simulateTiltLabel.textContent = `Corner: ${corner.label}`;
          hintText.textContent = `Simulating tilt toward ${corner.label}`;
        }
      });

      resetBtn.addEventListener('click', () => {
        demoCornerIndex = -1;
        pointer.active = false;
        gyro.targetGx = 0;
        gyro.targetGy = 0;
        gyro.baseBeta = null;
        gyro.baseGamma = null;
        simulateTiltLabel.textContent = 'Tilt to Corner';
        hintText.textContent = 'Tilt phone or drag to sweep particles into a corner';
        initParticles();
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
        initParticles();
      });

      window.onload = function () {
        resizeCanvas();
        initParticles();
        setupSensors();
        animate();
      };
    })();
  </script>
</body>
</html>
